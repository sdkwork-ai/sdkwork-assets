# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/assets/webserver.pid;
error_log /var/log/sdkwork/assets/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name assets-test.sdkwork.com assets-test.birdcoder.com assets-test.dtupay.com assets-test.sdkwork.cn assets-test.birdcoder.cn assets-test.dtupay.cn assets-test.skubc.com assets-test.skubc.cn assets-test.zowalk.com assets-test.zowalk.cn assets-test.offer86.com assets-test.offer86.cn assets-test.86offer.com assets-test.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
