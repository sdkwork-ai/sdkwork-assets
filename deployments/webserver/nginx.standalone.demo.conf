# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/assets/webserver.pid;
error_log /var/log/sdkwork/assets/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name assets-demo.sdkwork.com assets-demo.birdcoder.com assets-demo.dtupay.com assets-demo.noaper.com assets-demo.sdkwork.cn assets-demo.birdcoder.cn assets-demo.dtupay.cn assets-demo.noaper.cn assets-demo.skubc.com assets-demo.skubc.cn assets-demo.zowalk.com assets-demo.zowalk.cn assets-demo.offer86.com assets-demo.offer86.cn assets-demo.86offer.com assets-demo.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/assets/web/pc;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
