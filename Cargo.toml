[workspace]
resolver = "2"
members = [
    "crates/sdkwork-api-assets-standalone-gateway",
    "crates/sdkwork-api-assets-assembly",
    "crates/sdkwork-routes-assets-app-api",
  "crates/sdkwork-assets-contract",
  "crates/sdkwork-assets-ingestion",
  "crates/sdkwork-assets-ingestion-drive",
  "crates/sdkwork-assets-bridge-image",
]

[workspace.package]
rust-version = "1.85"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.lints.rust]
# RUST_CODE_SPEC.md section 13 baseline.
# Deny-tier lints (unsafe_code, panic, unwrap_used, expect_used, pedantic) are
# promoted per crate together with their cleanup: enabling them fleet-wide
# today floods or fails builds that have not paid that debt yet.
unsafe_op_in_unsafe_fn = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
exit = "warn"

[workspace.dependencies]
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
axum = { version = "0.8", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono"] }
tower = { version = "0.5", features = ["util"] }
sdkwork-web-bootstrap = { path = "../sdkwork-web-framework/crates/sdkwork-web-bootstrap" }
sdkwork-web-core = { path = "../sdkwork-web-framework/crates/sdkwork-web-core" }
sdkwork-utils-rust = { path = "../sdkwork-utils/packages/sdkwork-utils-rust" }
sdkwork-database-sqlx = { path = "../sdkwork-database/crates/sdkwork-database-sqlx", package = "sdkwork-database-sqlx" }
sdkwork-api-assets-assembly = { path = "crates/sdkwork-api-assets-assembly" }
sdkwork-routes-assets-app-api = { path = "crates/sdkwork-routes-assets-app-api" }
sdkwork-routes-drive-app-api = { path = "../sdkwork-drive/crates/sdkwork-routes-drive-app-api" }
sdkwork-drive-http = { path = "../sdkwork-drive/crates/sdkwork-drive-http", features = ["redis-rate-limit"] }
sdkwork-drive-contract = { path = "../sdkwork-drive/crates/sdkwork-drive-contract" }
sdkwork-drive-workspace-service = { path = "../sdkwork-drive/crates/sdkwork-drive-workspace-service" }
sdkwork-assets-contract = { path = "crates/sdkwork-assets-contract" }
sdkwork-assets-ingestion = { path = "crates/sdkwork-assets-ingestion" }
sdkwork-assets-ingestion-drive = { path = "crates/sdkwork-assets-ingestion-drive" }
sdkwork-image-generation-service = { path = "../sdkwork-image/crates/sdkwork-image-generation-service" }
thiserror = "2"
